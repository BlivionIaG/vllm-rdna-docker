# Minimal complete valid configuration. Exercises every required section plus
# the optional aliases/patches/artifacts sections.

[project]
name = "vllm-rdna-docker"
schema_version = 1
description = "Minimal valid fixture"
reserved_tags = ["v0.22.1", "v0.22.1_base"]

[architecture]
targets = ["gfx1030", "gfx1100", "gfx1101", "gfx1150", "gfx1151", "gfx1200", "gfx1201"]

[registry]
host = "docker.io"
base_repository = "blivioniag/rocm-rdna"
vllm_repository = "blivioniag/vllm-rdna"

[bases.rocm720]
id = "rocm720"
rocm_version = "7.2.0"
python_version = "3.12"
pytorch_version = "2.12.0"
triton_version = "3.6.0"
base_image = "rocm/dev-ubuntu-22.04:7.2-complete"
base_digest = "sha256:a1b2c3d4e5f60718293a4b5c6d7e8f900a1b2c3d4e5f60718293a4b5c6d7e8f9"
pytorch_index_url = "https://download.pytorch.org/whl/rocm7.2"
tag = "7.2.0"
patches = ["rccl-rdna-tuning-index"]

[sources.upstream026]
id = "upstream026"
variant = "upstream"
repository = "https://github.com/vllm-project/vllm.git"
version = "0.26.0"
ref = "v0.26.0"
commit = "4a7c2e91d0b8536f1c9e2d4a6b8c0e2f4a6c8e0b"
compatible_bases = ["rocm720"]

[sources.extras026]
id = "extras026"
variant = "extras-fork"
repository = "https://github.com/blivioniag/vllm.git"
version = "0.26.0"
ref = "v0.26.0-extras"
commit = "9f3b6d1a8c5e0274b6d8a0c2e4f6a8c0d2e4f6a8"
compatible_bases = ["rocm720"]

[[images]]
id = "vllm-026-upstream-rocm720"
base = "rocm720"
source = "upstream026"
tag = "v0.26.0"

[[images]]
id = "vllm-026-extras-rocm720"
base = "rocm720"
source = "extras026"
tag = "v0.26.0-extras"

[aliases]
"v0.26.0" = "vllm-026-upstream-rocm720"
"v0.26.0-extras" = "vllm-026-extras-rocm720"

[patches.rccl-rdna-tuning-index]
id = "rccl-rdna-tuning-index"
base = "rocm720"
description = "RCCL tuning-index mapping for RDNA arches"
sha256 = "0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0"

[artifacts.cutlass-rdna-headers]
id = "cutlass-rdna-headers"
url = "https://artifacts.blivioniag.example/vllm-rdna/cutlass-4.4.2-rdna-headers.tar.zst"
sha256 = "aa11bb22cc33dd44ee55ff6677889900aa11bb22cc33dd44ee55ff6677889900"
