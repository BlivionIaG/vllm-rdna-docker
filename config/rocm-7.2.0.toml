# vllm-rdna-docker release configuration — ROCm 7.2.x line.
#
# Contract: vllm-rdna-docker/config/schema.md
# Check:    python vllm-rdna-docker/tools/validate.py --config vllm-rdna-docker/config/rocm-7.2.0.toml
#
# This config describes:
#   * one portable seven-architecture RDNA target set (no primary arch);
#   * three ROCm base stacks (rocm720, rocm721, rocm714) published as
#     blivioniag/rocm-rdna — each base pins its OWN upstream base_image and
#     base_digest; there is no project-level default image;
#   * two vLLM sources (upstream v0.26.0, extras-fork v0.26.0-extras);
#   * six explicit approved base x source images published as blivioniag/vllm-rdna;
#   * unqualified aliases for the two default (rocm720) combinations.

[project]
name = "vllm-rdna-docker"
schema_version = 1
description = "Podman-first ROCm/RDNA base + vLLM application image release pipeline"
# Legacy images are preserved: no image or alias in this pipeline may claim them.
reserved_tags = ["v0.22.1", "v0.22.1_base"]

[architecture]
# Fixed project-wide target set. Exactly these seven, nothing else, no primary.
targets = ["gfx1030", "gfx1100", "gfx1101", "gfx1150", "gfx1151", "gfx1200", "gfx1201"]

[registry]
host = "docker.io"
base_repository = "blivioniag/rocm-rdna"
vllm_repository = "blivioniag/vllm-rdna"

# ---------------------------------------------------------------------------
# Base stacks — built once per base, reused by every approved application image.
# ---------------------------------------------------------------------------

[bases.rocm720]
id = "rocm720"
rocm_version = "7.2.0"
python_version = "3.12"
pytorch_version = "2.12.0"
triton_version = "3.5.1"
base_image = "rocm/dev-ubuntu-22.04:7.2-complete"
base_digest = "sha256:a1b2c3d4e5f60718293a4b5c6d7e8f900a1b2c3d4e5f60718293a4b5c6d7e8f9"
pytorch_index_url = "https://download.pytorch.org/whl/rocm7.2"
tag = "7.2.0"
patches = ["rccl-rdna-tuning-index"]

[bases.rocm720.flash_attention]
install = "base"
version = "2.8.4"
repo = "https://github.com/ROCm/flash-attention.git"
ref = "tridao"

[bases.rocm721]
id = "rocm721"
rocm_version = "7.2.1"
python_version = "3.12"
pytorch_version = "2.12.0"
triton_version = "3.5.1"
base_image = "rocm/dev-ubuntu-22.04:7.2.1-complete"
base_digest = "sha256:f9e8d7c6b5a493827160f5e4d3c2b1a09f8e7d6c5b4a39281706f5e4d3c2b1a0"
pytorch_index_url = "https://download.pytorch.org/whl/rocm7.2"
tag = "7.2.1"

# 7.14.0 pins its own upstream image/digest: per-base pinning, no project default.
[bases.rocm714]
id = "rocm714"
rocm_version = "7.14.0"
python_version = "3.12"
pytorch_version = "2.13.0"
triton_version = "3.7.1"
base_image = "rocm/dev-ubuntu-22.04:7.14.0-full"
base_digest = "sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
pytorch_index_url = "https://download.pytorch.org/whl/rocm7.14"
tag = "7.14.0"

[bases.rocm714.flash_attention]
install = "base"
version = "2.7.4"
repo = "https://github.com/Dao-AILab/flash-attention"
ref = "main"

# ---------------------------------------------------------------------------
# vLLM sources — upstream releases and independently versioned extras-fork
# releases. Commits are immutable; the resolver (Todo 2) verifies ref<->commit.
# ---------------------------------------------------------------------------

[sources.upstream026]
id = "upstream026"
variant = "upstream"
repository = "https://github.com/vllm-project/vllm.git"
version = "0.26.0"
ref = "v0.26.0"
commit = "568afb3a13806beb53bb2e6bd518269357b237c0"
compatible_bases = ["rocm720", "rocm721", "rocm714"]

[sources.extras026]
id = "extras026"
variant = "extras-fork"
repository = "https://github.com/blivioniag/vllm.git"
version = "0.26.0"
ref = "v0.26.0-extras"
commit = "9f3b6d1a8c5e0274b6d8a0c2e4f6a8c0d2e4f6a8"
compatible_bases = ["rocm720", "rocm721", "rocm714"]

# ---------------------------------------------------------------------------
# Images — the explicit approved matrix. No automatic Cartesian product:
# adding a base or a source changes nothing until an [[images]] entry is added.
# ---------------------------------------------------------------------------

# Default combinations (rocm720) produce the unqualified tags.
[[images]]
id = "vllm-026-upstream-rocm720"
base = "rocm720"
source = "upstream026"
tag = "v0.26.0"

[[images]]
id = "vllm-026-extras-rocm720"
base = "rocm720"
source = "extras026"
tag = "v0.26.0-extras"

# Alternate-base combinations produce qualified tags.
[[images]]
id = "vllm-026-upstream-rocm721"
base = "rocm721"
source = "upstream026"
tag = "v0.26.0-rocm7.2.1"

[[images]]
id = "vllm-026-extras-rocm721"
base = "rocm721"
source = "extras026"
tag = "v0.26.0-extras-rocm7.2.1"

[[images]]
id = "vllm-026-upstream-rocm714"
base = "rocm714"
source = "upstream026"
tag = "v0.26.0-rocm7.14.0"

[[images]]
id = "vllm-026-extras-rocm714"
base = "rocm714"
source = "extras026"
tag = "v0.26.0-extras-rocm7.14.0"

# Unqualified aliases point only at the declared default combinations.
[aliases]
"v0.26.0" = "vllm-026-upstream-rocm720"
"v0.26.0-extras" = "vllm-026-extras-rocm720"

# ---------------------------------------------------------------------------
# EXPERIMENTAL sections (schema.md): patches and external artifacts.
# ---------------------------------------------------------------------------

[patches.rccl-rdna-tuning-index]
id = "rccl-rdna-tuning-index"
base = "rocm720"
description = "RCCL tuning-index mapping for gfx1030/gfx1100/gfx1200 (rocm-systems PR #2166)"
sha256 = "0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0"

[artifacts.cutlass-rdna-headers]
id = "cutlass-rdna-headers"
url = "https://artifacts.blivioniag.example/vllm-rdna/cutlass-4.4.2-rdna-headers.tar.zst"
sha256 = "aa11bb22cc33dd44ee55ff6677889900aa11bb22cc33dd44ee55ff6677889900"
