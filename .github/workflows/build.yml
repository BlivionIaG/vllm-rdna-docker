# GitHub Actions for vllm-rdna-docker.
#
# The whole build is driven by `docker-bake.hcl` (the source of truth)
# and stock `docker/bake-action`. No Python wrapper, no custom linter.

name: vllm-rdna-docker build

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Bake target (base-<id>, vllm-<id>, all-bases, all-vllm, all)'
        required: true
        type: choice
        options:
          - all
          - all-vllm
          - all-bases
          - base-rocm720
          - base-rocm714
          - vllm-0260-rocm720
          - vllm-0260-rocm714
          - vllm-0260-rocm720-extras
          - vllm-0260-rocm714-extras
        default: all
      push:
        description: 'Push images to the registry (requires credentials)'
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ${{ vars.VLLM_RDNA_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: ${{ inputs.push || github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: blivioniag/vllm-rdna
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=v(.*),group=1

      - name: Bake
        uses: docker/bake-action@v5
        with:
          files: docker-bake.hcl
          targets: ${{ inputs.target || 'all' }}
          push: ${{ inputs.push || github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
